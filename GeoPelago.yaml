# GeoPelago player options
# Fill this in, then give it to whoever generates the multiworld.
# The game name below must match GAME_NAME in the GeoPelago website.

name: Player{number}          # Your slot name. {number} and {player} are filled in automatically.
game: GeoPelago
description: Default GeoPelago player options

requires:
  version: 0.5.0

GeoPelago:
  # ----- Standard Archipelago options -----

  progression_balancing: 50   # 0-99. Higher moves progression items to earlier spheres.
  accessibility: full         # full: every location reachable. minimal: only the goal must be reachable.

  # ----- Countries -----
  # Each country is an item. You can only guess in a country once its item has been found.

  starting_countries: 3       # 1-10. Countries unlocked from the start.

  excluded_countries: []      # Countries that never appear in the item pool. Names must match the site, e.g.:
  # excluded_countries:
  #   - Russia
  #   - Ukraine

  starting_country_list: []   # Choose your starting countries instead of random ones.
  # starting_country_list:
  #   - Japan
  #   - Brazil

  # ----- Checks -----
  # The site always has 100 score checks (25 each for 0-1999, 2000-2999, 3000-3999, 4000-5000)
  # and 50 "Correct Country" checks.

  score_checks:
    0-1999: 25                # 0-25 checks in each bracket that are active in this run.
    2000-2999: 25
    3000-3999: 25
    4000-5000: 25

  country_checks: 50          # 0-50 "Correct Country" checks active in this run.

  # ----- Goal -----
  # The goal is fixed: unlock every country in the pool. The website reports the goal as
  # complete once every country item (minus any in excluded_countries) has been received.

  # ----- Common Archipelago options -----

  start_inventory: {}         # Items you begin with, e.g. { Japan: 1 }
  local_items: []             # Items forced to stay in your own world.
  non_local_items: []         # Items forced into other players' worlds.
  start_hints: []             # Items whose locations are hinted at the start.
  exclude_locations: []       # Locations that will only hold filler items.
