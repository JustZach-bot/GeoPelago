# GeoPelago 0.6.0 player options
# Fill this in, then give it to whoever generates the multiworld.
# The game name below must match GAME_NAME in the GeoPelago website.

name: Player{number}          # Your slot name. {number} and {player} are filled in automatically.
game: GeoPelago
description: Default GeoPelago 0.6.0 player options

requires:
  version: 0.6.0

GeoPelago:
  # ----- Standard Archipelago options -----

  progression_balancing: 50   # 0-99. Higher moves progression items to earlier spheres.
  accessibility: full         # full: every location reachable. minimal: only the goal must be reachable.

  # ----- Countries -----
  # Each of the 197 countries is an item. You can only guess in a country once its item has been found.

  starting_countries: 3       # 1-10. Countries unlocked from the start.

  starting_country_list: []   # Choose your starting countries instead of random ones.
  # starting_country_list:
  #   - Japan
  #   - Brazil

  # ----- Goal -----

  countries_required: 50      # 1-197. How many countries you must unlock to finish.
                              # Starting countries count, so this must be higher than your starting countries.

  # ----- Checks -----
  # Each value can be 0-999. You need at least 250 checks in total across all five lines.
  # The default is an even split: 50 + 50 + 50 + 50 + 50 = 250.
  #
  # Logic: the 0-1999 checks are open from the start (so you need at least 5 of them). The 2000-2999, 3000-3999
  # and 4000-5000 checks each need their own unlock item, and the Correct Country checks need the
  # "Correct Country Unlock" item. A group set to 0 has no checks and no unlock item.

  score_checks:
    0-1999: 50
    2000-2999: 50
    3000-3999: 50
    4000-5000: 50

  country_checks: 50          # "Correct Country" checks

  # ----- Common Archipelago options -----

  start_inventory: {}         # Items you begin with, e.g. { Japan: 1 }
  local_items: []             # Items forced to stay in your own world.
  non_local_items: []         # Items forced into other players' worlds.
  start_hints: []             # Items whose locations are hinted at the start.
  exclude_locations: []       # Locations that will only hold filler items.
