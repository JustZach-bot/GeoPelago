# GeoPelago 0.5.6 player options
# Fill this in, then give it to whoever generates the multiworld.

name: Player{number}          # Your slot name. {number} and {player} are filled in automatically.
game: GeoPelago
description: Default GeoPelago 0.5.6 player options

requires:
  version: 0.5.0
# Internal use only. Please disregard

GeoPelago:

  progression_balancing: 50   # 0-99. Higher moves progression items to earlier spheres.
  accessibility: full         # full: every location reachable. minimal: only the goal must be reachable.

  # ----- Countries -----
  # Each of the 197 countries is an item. You can only guess in a country once its item has been found.

  starting_countries: 3       # 1-10. Countries unlocked from the start.

  starting_country_list: []   # Choose your starting countries instead of random ones.
  # starting_country_list:
  #   - Japan
  #   - Brazil

  # ----- Goal -----

  countries_required: 50      # 1-197. How many countries you must unlock to finish.
                              # Starting countries count. Must be higher than your starting countries
                              # and no larger than the number of countries left in the pool.

  # ----- Checks -----
  # Each value can be 0-999. You need at least 250 checks in total across all five lines.
  # The default is an even split: 50 + 50 + 50 + 50 + 50 = 250.

  score_checks:
    0-1999: 50
    2000-2999: 50
    3000-3999: 50
    4000-5000: 50

  country_checks: 50          # "Correct Country" checks

